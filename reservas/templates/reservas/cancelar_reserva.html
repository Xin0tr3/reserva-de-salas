<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de salas</title>
    <!--CSS-->
    <link rel="stylesheet" href="styles/style.css">
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<nav>
    <ul>
        <li> <a class="admin" href="#section1">Administrador</a> </li>
    </ul>
</nav>

<body>

    <section>
        <h1> Cancelar Reserva</h1>
    </section>

    <section id="paso-1" class="paso activo">
        <label for="codigo-cancelacion">Ingresa el codigo de tu reserva</label><br>
        <input type="text" id="codigo-cancelacion" name="codigo-cancelacion" placeholder="Ingrese el codigo"><br>

        <div class="botones-navegacion">
            <button type="button" id="siguiente-paso-1" class="btn-siguiente">Siguiente</button>
        </div>
    </section>

    <section id="paso-2" class="paso oculto">
        <h1> ¿Confirma la cancelacion de su reserva? </h1>
        <div id="resumen-reserva-cancelar">
            <!-- Se rellena solo -->
        </div>

        <div class="botones-navegacion">
            <button type="button" id="volver-paso-1" class="btn-volver">Volver</button>
            <button type="button" id="confirmar-cancelacion" class="btn-siguiente">Confirmar</button>
        </div>
    </section>

<!-- JS -->
<script src="scripts/cancelar_reserva.js"></script>
</body>
    

</html>
