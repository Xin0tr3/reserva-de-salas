<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de salas</title>
    <!--CSS-->
    <link rel="stylesheet" href="styles/style.css">
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <nav>
    <ul>
        <li class="esconder"> <a href="#"
                rel="noopener noreferrer" target="_blank">Administrador</a>
        <li class="menu" onclick=mostrarBarra()> <svg xmlns="http://www.w3.org/2000/svg" height="48px"
                viewBox="0 -960 960 960" width="48px" fill="#e3e3e3">
                <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
            </svg> </li>
    </ul>

    <ul class="barra">
        <li onclick=esconderBarra()> <svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960"
                width="48px" fill="#e3e3e3">
                <path
                    d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
            </svg></li>
        <li> <a href="#" rel="noopener noreferrer"
                target="_blank">Administrador</a> </li>
    </ul>
    </nav>
    <div class="contenedor-principal">
        <!-- Seleccionar sala -->
        <section id="paso-1" class="paso-activo">
            <h2>Selecciona una sala</h2>
            <div id="contenedor-salas" class="botones">
                <div class="botones-inicio" id="salas-grid">
                    <!-- Las salas se cargarán aquí dinámicamente -->
                </div>
            </div>
        </section>

        <!-- Seleccionar fecha y hora -->
        <section id="paso-2" class="oculto">
            <h3>Selecciona fecha y hora</h3>
            
            <div id="info-sala" class="info-sala">
                <p><strong>Sala seleccionada: </strong> <span id="nombre-sala-seleccionada">-</span></p>
                <p><strong>Capacidad máxima: </strong><span id="capacidad-sala-seleccionada">-</span> personas</p>
                <p><strong>Horario disponible: </strong><span id="Horario-sala">-</span></p>
            </div>
            <label for="fecha-inicio">Fecha y hora de inicio:</label><br>
            <input id="fecha-inicio" type="text" data-id="minMaxTime" placeholder="Seleccione fecha y hora" readonly><br>

            <label for="fecha-termino">Fecha y hora de término:</label><br>
            <input id="fecha-termino" type="text" data-id="minMaxTime" placeholder="Seleccione fecha y hora" readonly><br>
            
            <div id="horas-disponibles" style="margin-bottom: 20px;">
                <!-- Se rellena automaticamente -->
            </div>
            
            <div class="botones-navegacion">
                <button type="button" id="volver-paso-1" class="btn-volver">Volver</button>
                <button type="button" id="siguiente-paso-2" class="btn-siguiente">Siguiente</button>
            </div>

        </section>

        <!-- Ingresar datos de la reserva -->
        <section id="paso-3" class="oculto">
            <h3>Ingresa los datos de tu reserva</h3>
            <label for="tevento">Titulo evento:</label><br>
            <input type="text" id="tevento" name="tevento" placeholder="Titulo de tu evento"><br>
            <label for="devento">Descripcion evento:</label><br>
            <input type="text" id="devento" name="devento" placeholder="Describe el evento"><br>
            <label for="nusuario">Nombre de quien reserva:</label><br>
            <input type="text" id="nusuario" name="tevento" placeholder="Titulo"><br>
            <label for="depto">Departamento:</label><br>
            <input type="text" id="depto" name="tevento" placeholder="Departamento"><br>
            <label for="correo">Correo:</label><br>
            <input type="email" id="correo" name="correo" placeholder="Tu correo"><br>
            <label for="equip">Equipamiento extra:</label><br>
            <input type="text" id="equip" name="equip" placeholder="Equipamiento"><br>
            <label for="equip">Rut:</label><br>
            <input type="text" id="rut" name="rut" placeholder="XX-XXX-XXX-X"><br>
            
            <h3>Invitados</h3>
            <div id="info-invitados">
                <!-- Se tiene que agregar capacidad dinamica según sala -->
                <p>Capacidad disponible: <span id="capacidad-restante">X</span>personas</p>

            </div>

            <div id="contenedor-invitados">
                <!-- Se rellena solo -->
            </div>
            <button type="button" id="agregar-invitado" class="btn-agregar-invitado">Agregar invitado</button>

            <div class="botones-navegacion">
                <button type="button" id="volver-paso-2" class="btn-volver">Volver</button>
                <button type="button" id="siguiente-paso-3" class="btn-siguiente">Siguiente</button>
            </div>
        </section>

        <!-- Confirmar reserva -->
        <section id="paso-4" class="oculto">
            <h3>¿Confirmas la reserva?</h3>
            <div id="resumen-reserva">
                <!-- Se rellena automaticamente -->
            </div>

            <div class="botones-navegacion">
                <button type="button" id="volver-paso-3" class="btn-volver">Volver</button>
                <button type="button" id="confirmar-reserva" class="btn-confirmar">Confirmar reserva</button>
            </div>
        </section>
    </div>

</body>

<script>

</script>

</html>
