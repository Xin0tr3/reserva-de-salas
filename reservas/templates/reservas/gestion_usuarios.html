{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="{% static 'reservas/styles/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav>
        <ul>
            <li> <a class="admin" href="/">Inicio</a> </li>
        </ul>
    </nav>

    <!-- PASO 1: Lista con paginación -->
    <section id="paso-1" class="paso activo">
        <h2>Gestión de Usuarios</h2>
        <div id="contenedor-usuario">
            <!-- Se rellena dinámicamente -->
        </div>
        <div id="paginacion">
            <!-- Se rellena dinámicamente -->
        </div>
    </section>

    <!-- PASO 2: Detalles/Edición -->
    <section id="paso-2" class="paso oculto">
        <h2>Detalles del Usuario</h2>
        <div id="detalles-usuario">
            <!-- Se rellena dinámicamente -->
        </div>
        <div class="botones-navegacion">
            <button id="volver-paso-1" class="btn-volver">Volver</button>
            <button id="guardar-cambios" class="btn-confirmar">Guardar Cambios</button>
        </div>
    </section>

    <!-- Modal de confirmación -->
    <div id="modal-confirmacion" class="modal">
        <div class="modal-contenido">
            <span id="btn-cerrar-modal" class="cerrar">&times;</span>
            <h2 id="titulo-modal">¿Confirmas la eliminación?</h2>
            <div class="botones-modal">
                <button id="btn-confirmar-eliminar" class="btn-confirmar">Eliminar</button>
                <button id="btn-cancelar-modal" class="btn-cancelar" onclick="document.getElementById('modal-confirmacion').style.display='none'">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="{% static 'reservas/scripts/gestion_administrador.js' %}"></script>
</body>

</html>
